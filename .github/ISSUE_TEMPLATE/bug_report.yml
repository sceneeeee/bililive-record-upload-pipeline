name: Bug report
description: Report a reproducible issue with sanitized evidence
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, SESSDATA, tokens, personal paths, raw production logs, recordings, database files or `temp_report.md`. For security vulnerabilities, follow [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened using sanitized details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Prefer synthetic fixtures and a minimal reproducible example.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or release
      placeholder: Full commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Non-sensitive environment
      description: OS, Python/Node versions and pinned upstream versions only.
  - type: textarea
    id: tests
    attributes:
      label: Validation performed
      description: Commands and sanitized results.
