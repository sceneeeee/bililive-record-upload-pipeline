name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Rebuild SHA256-locked upstream bundles
        run: bash scripts/extract_upstream.sh
      - name: Python and Node.js tests
        run: bash tests/run.sh
      - name: Syntax and systemd
        run: |
          python3 -m compileall -q scripts tests
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          for f in tests/*.cjs build/index-*.cjs; do node --check "$f"; done
          bash tests/validate_units.sh
          git diff --check
      - name: Compose (synthetic configuration only)
        env:
          BILILIVE_TOOLS_PASSKEY: ci-placeholder
          BILILIVE_TOOLS_BILIKEY: ci-placeholder
          BREC_HTTP_BASIC_USER: ci-placeholder
          BREC_HTTP_BASIC_PASS: ci-placeholder
        run: |
          docker compose -f compose/compose.base.example.yaml config --quiet
          docker compose -f compose/compose.example.yaml config --quiet
      - name: Gitleaks (pinned binary and checksum)
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          python3 scripts/export_index.py /tmp/staged-scan
          /tmp/gitleaks dir --redact --no-banner /tmp/staged-scan
          /tmp/gitleaks git --redact --no-banner --log-opts='--all' .
          python3 scripts/scan_repository.py --staged
          python3 scripts/scan_repository.py --history
